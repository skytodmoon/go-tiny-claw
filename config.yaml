# 数据库配置
database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "postgres"
  name: "myapp_db"
  ssl_mode: "disable"

# 日志配置
logging:
  level: "info"  # debug, info, warn, error, fatal
  file: "/var/log/myapp.log"
  max_size: 10  # 日志文件最大大小（MB）
  max_backups: 5  # 保留的日志文件备份数量
  max_age: 30  # 日志文件保留天数

# 应用设置
app:
  name: "MyApp"
  port: 8080
  env: "development"  # development, staging, production
  debug: true
